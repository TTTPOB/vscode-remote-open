name: Release and Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write  # required for gh-release to upload assets
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package extension
        run: pnpm vsce package --no-dependencies

      - name: Locate VSIX
        id: vsix
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(ls -1 *.vsix | head -n 1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.vsix.outputs.file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to VS Code Marketplace
        run: pnpm vsce publish --azure-credential --packagePath "${{ steps.vsix.outputs.file }}"
